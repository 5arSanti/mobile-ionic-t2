<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title> Galeria de Fotos </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-card>
    <ion-card-header>
      <ion-card-title>
        Por: Johel Santiago Arias Becerra
      </ion-card-title>
    </ion-card-header>
  </ion-card>

  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Galeria de Fotos</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-grid>
    <ion-row>
      @for (photo of photoService.photos; track photo.filepath) {
      <ion-col
        size="6"
        (click)="showActionSheet(photo, photoService.photos.indexOf(photo))"
      >
        @if (photo.webviewPath) {
        <ion-img [src]="photo.webviewPath" alt="Foto" class="photo-thumb" />
        }
      </ion-col>
      }
    </ion-row>
  </ion-grid>

  <ion-fab vertical="bottom" horizontal="center" slot="fixed">
    <ion-fab-button (click)="addNewToGalery()">
      <ion-icon name="camera"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
